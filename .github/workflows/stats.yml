name: Update stats

on:
  schedule:
    - cron: '*/10 * * * *'   # 10分おきに実行
  workflow_dispatch:          # 手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from GoatCounter
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 .github/scripts/fetch_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update stats"
          git push
